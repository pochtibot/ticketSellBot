services:
  # ─── База данных ──────────────────────────────────────────
  db:
    image: postgres:16
    container_name: ticketbot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ticketbot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketbot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ─── Telegram бот — основной сервис ──────────────────────
  telegram:
    build: .
    container_name: ticketbot-telegram
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.telegram
    command: ["python", "-m", "app.bot.telegram"]
    labels:
      description: "TicketBot — Telegram"

  # ─── VK бот (profile: all) ────────────────────────────────
  vk:
    build: .
    container_name: ticketbot-vk
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.vk
    command: ["python", "-m", "app.bot.vk"]
    profiles:
      - all
    labels:
      description: "TicketBot — VK"

  # ─── MAX бот (profile: all) ────────────────────────────────
  max:
    build: .
    container_name: ticketbot-max
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.max
    command: ["python", "-m", "app.bot.max"]
    profiles:
      - all
    labels:
      description: "TicketBot — MAX"

  # ─── Seed — тестовые мероприятия (profile: seed) ───────────
  seed:
    build: .
    container_name: ticketbot-seed
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/ticketbot
    command: ["python", "-m", "app.bot.seed"]
    profiles:
      - seed

  # ─── Web (Mini App API) — FastAPI сервер ──────────────────────
  web:
    build: .
    container_name: ticketbot-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.telegram
    environment:
      VK_TEMP_KEY: ${VK_TEMP_KEY:-}
    command: ["python", "-m", "app.bot.web"]
    ports:
      - "127.0.0.1:8080:8080"
    labels:
      description: "TicketBot — Web/Mini App API"

volumes:
  pgdata:
