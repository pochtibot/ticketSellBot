# Production override for docker-compose.yml
# Используется: docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# Отключает проброс портов БД наружу, добавляет рестарт-политики.

services:
  db:
    ports: !reset []  # Не пробрасываем порт БД наружу в продакшене
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  telegram:
    restart: always
    volumes: []
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  vk:
    restart: always
    volumes: []
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  max:
    restart: always
    volumes: []
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    restart: always
    volumes: []
    ports: !reset []  # За reverse proxy (Caddy/Nginx)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  seed:
    restart: "no"
    profiles:
      - seed
