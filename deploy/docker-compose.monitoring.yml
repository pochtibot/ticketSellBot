services:
  loki:
    image: grafana/loki:latest
    container_name: ticketbot-loki
    restart: unless-stopped
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:latest
    container_name: ticketbot-promtail
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/promtail-config.yml:/etc/promtail/config.yml

  grafana:
    image: grafana/grafana:latest
    container_name: ticketbot-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/datasources.yml:/etc/grafana/provisioning/datasources/loki.yml

  # ─── Prometheus — сбор метрик ──────────────────────────
  prometheus:
    image: prom/prometheus
    container_name: ticketbot-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"

  # ─── PostgreSQL Exporter — метрики БД ──────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: ticketbot-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@db:5432/ticketbot?sslmode=disable"

volumes:
  loki-data:
  grafana-data:
  prometheus-data:
