# Beget-specific override для TicketBot
# — оптимизация PostgreSQL под 1-2 GB RAM VPS
#
# Использование:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.beget.yml up -d
#
# Или через Makefile:
#   make -C deploy up-beget

services:
  db:
    ports: !reset []  # База доступна только внутри Docker-сети
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ticketbot
      POSTGRES_CONFIG: |
        shared_buffers = 256MB
        effective_cache_size = 512MB
        work_mem = 4MB
        maintenance_work_mem = 64MB
        max_worker_processes = 2
        max_parallel_workers = 2
        max_parallel_workers_per_gather = 1
        track_activities = off
        track_counts = on
        track_functions = none
        track_io_timing = off
        wal_level = minimal
        max_wal_senders = 0
        autovacuum_max_workers = 1
        autovacuum_naptime = 1min

  telegram:
    restart: always
    volumes: []
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  vk:
    restart: always
    volumes: []
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  max:
    restart: always
    volumes: []
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  web:
    restart: always
    volumes: []
    ports: !reset []  # Веб-приложение доступно только через reverse proxy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  seed:
    restart: "no"
    profiles:
      - seed
