server {
    listen 80;
    server_name pochtibot.online;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # All HTTP → HTTPS redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pochtibot.online;

    ssl_certificate     /etc/letsencrypt/live/pochtibot.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pochtibot.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # API — прокси на FastAPI (web)
    location /api/ {
        proxy_pass http://web:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика (фронтенд Mini App и Telegram Mini App)
    location / {
        proxy_pass http://web:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthcheck
    location /health {
        proxy_pass http://web:8080/health;
    }
}

# Public portfolio landing page.
server {
    listen 80;
    server_name pochtibot.ru;

    location /.well-known/acme-challenge/ {
