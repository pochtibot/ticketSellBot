name: Deploy TicketBot

on:
  push:
    branches: [main, dev]
  workflow_dispatch:  # ручной запуск

env:
  COMPOSE_FILES: -f docker-compose.yml -f deploy/docker-compose.beget.yml -f deploy/docker-compose.monitoring.yml -f deploy/docker-compose.nginx.yml
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD_VK }}
          POSTGRES_DB: ticketbot_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Проверка Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: pip install -e ".[dev]"

      - name: Проверка импортов
        run: |
          python -c "
          from app.config import settings;
          from app.core.database import Base;
          from app.core.models import User, Event, Ticket, Payment;
          from app.core.schemas import EventOut, TicketOut;
          print('✅ Импорты OK')
          "

      - name: Запуск тестов
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:${{ secrets.DB_PASSWORD_VK }}@localhost:5432/ticketbot_test
        run: |
          # Полный контур: unit + интеграция + имитация user-flow (харнесс)
          pytest tests/ -v --timeout=60

  deploy:
    runs-on: self-hosted
    needs: [test]
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - name: 📥 Получить код
        uses: actions/checkout@v6

      - name: 📋 Создать .env.telegram из секретов
        run: |
          cat > .env.telegram << 'ENVEOF'
          DATABASE_URL=postgresql+asyncpg://tg_user:${{ secrets.DB_PASSWORD_TG }}@db:5432/ticketbot
          TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_TELEGRAM_IDS=${{ secrets.ADMIN_TELEGRAM_IDS }}
          WEBAPP_URL=${{ secrets.WEBAPP_URL || 'https://pochtibot.online' }}
          VK_APP_ID=${{ secrets.VK_APP_ID }}
          VK_SECRET_KEY=${{ secrets.VK_SECRET_KEY }}
          VK_TOKEN_ENCRYPTION_KEY=${{ secrets.VK_TOKEN_ENCRYPTION_KEY }}
          VK_PAY_ENABLED=${{ secrets.VK_PAY_ENABLED || 'false' }}
          VK_PAY_MERCHANT_ID=${{ secrets.VK_PAY_MERCHANT_ID }}
          VK_PAY_CLIENT_ID=${{ secrets.VK_PAY_CLIENT_ID }}
          VK_PAY_APP_SECURE_KEY=${{ secrets.VK_PAY_APP_SECURE_KEY }}
          VK_PAY_MERCHANT_PRIVATE_KEY=${{ secrets.VK_PAY_MERCHANT_PRIVATE_KEY }}
          VK_PAY_NOTIFICATION_PUBLIC_KEY=${{ secrets.VK_PAY_NOTIFICATION_PUBLIC_KEY }}
          DEBUG=false
          ENVEOF
          echo "✅ .env.telegram создан"

      - name: 📋 Создать .env из секретов
        run: |
          cat > .env << 'ENVEOF'
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          ENVEOF
          echo "✅ .env создан"

      - name: 📋 Создать .env.vk из секретов
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        if: env.VK_TOKEN != ''
        run: |
          cat > .env.vk << 'ENVEOF'
          DATABASE_URL=postgresql+asyncpg://vk_user:${{ secrets.DB_PASSWORD_VK }}@db:5432/ticketbot
          VK_TOKEN=${{ secrets.VK_TOKEN }}
          VK_GROUP_ID=${{ secrets.VK_GROUP_ID }}
          VK_APP_ID=${{ secrets.VK_APP_ID }}
          DEBUG=false
          ENVEOF
          echo "✅ .env.vk создан"

      - name: 📋 Создать .env.max из секретов
        env:
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
        if: env.MAX_TOKEN != ''
        run: |
          cat > .env.max << 'ENVEOF'
          DATABASE_URL=postgresql+asyncpg://max_user:${{ secrets.DB_PASSWORD_MAX }}@db:5432/ticketbot
          MAX_TOKEN=${{ secrets.MAX_TOKEN }}
          DEBUG=false
          ENVEOF
          echo "✅ .env.max создан"

      - name: 📋 Создать .env.monitoring из секретов
        run: |
          cat > .env.monitoring << 'ENVEOF'
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          ENVEOF
          echo "✅ .env.monitoring создан"

      - name: 🛑 Остановить старые контейнеры
        run: |
          docker compose ${{ env.COMPOSE_FILES }} down --remove-orphans 2>/dev/null || true
          echo "✅ Старые контейнеры остановлены"

      - name: 🏗️ Собрать новые образы
        run: |
          docker compose ${{ env.COMPOSE_FILES }} build
          echo "✅ Образы собраны"

      - name: 🐘 Запустить PostgreSQL
        run: |
          docker compose ${{ env.COMPOSE_FILES }} up -d db

      - name: ⏳ Ожидание PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker compose ${{ env.COMPOSE_FILES }} exec -T db pg_isready -U postgres -d ticketbot &>/dev/null; then
              echo "✅ PostgreSQL готов!"
              break
            fi
            echo "  попытка $i/30..."
            sleep 2
          done

      - name: 🗄️ Создать роли PostgreSQL
        run: |
          docker compose ${{ env.COMPOSE_FILES }} exec -T db bash -c "
          psql -U postgres <<-EOSQL
            -- Создать БД ticketbot, если её нет (volume мог быть очищен)
            SELECT 'CREATE DATABASE ticketbot'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'ticketbot')\\gexec

            CREATE EXTENSION IF NOT EXISTS pgcrypto;

            DO \\\$\\\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'tg_user') THEN
                CREATE ROLE tg_user WITH LOGIN PASSWORD '${{ secrets.DB_PASSWORD_TG }}';
              END IF;
            END \\\$\\\$;
            GRANT CONNECT ON DATABASE ticketbot TO tg_user;

            DO \\\$\\\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'vk_user') THEN
                CREATE ROLE vk_user WITH LOGIN PASSWORD '${{ secrets.DB_PASSWORD_VK }}';
              END IF;
            END \\\$\\\$;
            GRANT CONNECT ON DATABASE ticketbot TO vk_user;

            DO \\\$\\\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'max_user') THEN
                CREATE ROLE max_user WITH LOGIN PASSWORD '${{ secrets.DB_PASSWORD_MAX }}';
              END IF;
            END \\\$\\\$;
            GRANT CONNECT ON DATABASE ticketbot TO max_user;

            SELECT rolname FROM pg_catalog.pg_roles WHERE rolname IN ('tg_user', 'vk_user', 'max_user');
          EOSQL
          # Переключиться на ticketbot для GRANT на схему public
          psql -U postgres -d ticketbot <<-EOSQL2
            GRANT USAGE, CREATE ON SCHEMA public TO tg_user;
            GRANT USAGE, CREATE ON SCHEMA public TO vk_user;
            GRANT USAGE, CREATE ON SCHEMA public TO max_user;
          EOSQL2
          "
          echo "✅ Роли PostgreSQL созданы"

      - name: 🗄️ Накатить миграции
        run: |
          # Ставим alembic stamp на head (создаёт alembic_version если нет)
          docker compose ${{ env.COMPOSE_FILES }} run --rm \
            -e DATABASE_URL="postgresql+asyncpg://tg_user:${{ secrets.DB_PASSWORD_TG }}@db:5432/ticketbot" \
            --entrypoint python \
            telegram -c "
          from alembic.config import Config
          from alembic import command
          cfg = Config('alembic.ini')
          cfg.set_main_option('sqlalchemy.url', 'postgresql+asyncpg://tg_user:${{ secrets.DB_PASSWORD_TG }}@db:5432/ticketbot')
          command.stamp(cfg, 'head')
          print('✅ Миграции заштампованы')
          " 2>&1

      - name: 🗄️ Синхронизировать схему БД
        run: |
          # init_db() не добавляет колонки в существующие таблицы.
          # Применяем изменения идемпотентно через IF NOT EXISTS.
          docker compose ${{ env.COMPOSE_FILES }} exec -T db psql -U postgres -d ticketbot <<-EOSQL
            ALTER TABLE events ADD COLUMN IF NOT EXISTS channel_id UUID REFERENCES channels(id);

            -- deleted_at for events (soft delete)
            ALTER TABLE events ADD COLUMN IF NOT EXISTS deleted_at TIMESTAMPTZ;

            -- is_published for events (draft/publish workflow)
            ALTER TABLE events ADD COLUMN IF NOT EXISTS is_published BOOLEAN NOT NULL DEFAULT true;

            -- media fields for events (poster/image/video)
            ALTER TABLE events ADD COLUMN IF NOT EXISTS media_telegram_file_id VARCHAR(512);
            ALTER TABLE events ADD COLUMN IF NOT EXISTS media_type VARCHAR(20);

            -- invites_quota for events (invite tickets, pro)
            ALTER TABLE events ADD COLUMN IF NOT EXISTS invites_quota INTEGER NOT NULL DEFAULT 0;

            -- Возрастное ограничение мероприятия (ФЗ-436, миграция 0015)
            ALTER TABLE events ADD COLUMN IF NOT EXISTS age_restriction VARCHAR(4) NOT NULL DEFAULT '0+';

            -- invite tickets: is_invite / seats / invited_by (user_id nullable)
            ALTER TABLE tickets ADD COLUMN IF NOT EXISTS is_invite BOOLEAN NOT NULL DEFAULT FALSE;
            ALTER TABLE tickets ADD COLUMN IF NOT EXISTS seats INTEGER NOT NULL DEFAULT 1;
            ALTER TABLE tickets ADD COLUMN IF NOT EXISTS invited_by VARCHAR(255);
            ALTER TABLE tickets ALTER COLUMN user_id DROP NOT NULL;

            -- Промокоды (миграция 0012): поля применения скидки на платеже
            ALTER TABLE payments ADD COLUMN IF NOT EXISTS base_amount NUMERIC(10,2);
            ALTER TABLE payments ADD COLUMN IF NOT EXISTS discount_amount NUMERIC(10,2);
            ALTER TABLE payments ADD COLUMN IF NOT EXISTS promo_code VARCHAR(64);
            UPDATE payments SET base_amount = amount, discount_amount = 0 WHERE base_amount IS NULL;

            -- Динамические цены по дате (миграция 0013)
            ALTER TABLE events ADD COLUMN IF NOT EXISTS published_at TIMESTAMPTZ;
            ALTER TABLE payments ADD COLUMN IF NOT EXISTS price_range_label VARCHAR(64);

            -- VK Pay settlement references and pending reservations (migration 0016)
            ALTER TABLE payments ADD COLUMN IF NOT EXISTS provider VARCHAR(32);
            ALTER TABLE payments ADD COLUMN IF NOT EXISTS provider_order_id VARCHAR(128);
            ALTER TABLE payments ADD COLUMN IF NOT EXISTS provider_transaction_id VARCHAR(128);
            CREATE UNIQUE INDEX IF NOT EXISTS ix_payments_provider_order_id ON payments(provider_order_id);
            CREATE UNIQUE INDEX IF NOT EXISTS ix_payments_provider_transaction_id ON payments(provider_transaction_id);
            CREATE TABLE IF NOT EXISTS vk_pay_orders (
                id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                issuer_id VARCHAR(128) NOT NULL UNIQUE,
                event_id UUID NOT NULL REFERENCES events(id) ON DELETE CASCADE,
                user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                platform_user_id VARCHAR(255) NOT NULL,
                amount NUMERIC(10,2) NOT NULL,
                base_amount NUMERIC(10,2) NOT NULL,
                discount_amount NUMERIC(10,2) NOT NULL DEFAULT 0,
                promo_code_id UUID REFERENCES promo_codes(id) ON DELETE SET NULL,
                promo_code VARCHAR(64),
                status VARCHAR(16) NOT NULL DEFAULT 'pending',
                provider_transaction_id VARCHAR(128) UNIQUE,
                ticket_id UUID REFERENCES tickets(id) ON DELETE SET NULL,
                expires_at TIMESTAMPTZ NOT NULL,
                created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
                settled_at TIMESTAMPTZ
            );
            CREATE INDEX IF NOT EXISTS ix_vk_pay_orders_event_id ON vk_pay_orders(event_id);
            CREATE INDEX IF NOT EXISTS ix_vk_pay_orders_user_id ON vk_pay_orders(user_id);
            CREATE INDEX IF NOT EXISTS ix_vk_pay_orders_expires_at ON vk_pay_orders(expires_at);
            CREATE INDEX IF NOT EXISTS ix_vk_pay_order_event_status_expires ON vk_pay_orders(event_id, status, expires_at);
            CREATE INDEX IF NOT EXISTS ix_vk_pay_order_promo_status_expires ON vk_pay_orders(promo_code_id, status, expires_at);

            CREATE TABLE IF NOT EXISTS event_price_ranges (
                id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                event_id UUID NOT NULL REFERENCES events(id) ON DELETE CASCADE,
                starts_at TIMESTAMPTZ NOT NULL,
                ends_at TIMESTAMPTZ NOT NULL,
                price NUMERIC(10,2) NOT NULL,
                created_at TIMESTAMPTZ NOT NULL DEFAULT now()
            );
            CREATE INDEX IF NOT EXISTS ix_event_price_ranges_event_id ON event_price_ranges(event_id);

            -- Ник пользователя (миграция 0014) — поиск суперадмином по @username
            ALTER TABLE users ADD COLUMN IF NOT EXISTS username VARCHAR(64);
            CREATE INDEX IF NOT EXISTS ix_users_username ON users(username);

            -- Организатор: подписка на пользователя + owner-мероприятия
            ALTER TABLE users ADD COLUMN IF NOT EXISTS is_subscription_active BOOLEAN NOT NULL DEFAULT FALSE;
            ALTER TABLE users ADD COLUMN IF NOT EXISTS subscription_until TIMESTAMPTZ;
            ALTER TABLE users ADD COLUMN IF NOT EXISTS subscription_tier subscriptiontier NOT NULL DEFAULT 'basic';
            ALTER TABLE users ADD COLUMN IF NOT EXISTS deleted_at TIMESTAMPTZ;
            ALTER TABLE events ADD COLUMN IF NOT EXISTS owner_user_id UUID REFERENCES users(id);
            ALTER TABLE events ALTER COLUMN channel_id DROP NOT NULL;

            -- channel_admins (multi-admin support)
            CREATE TABLE IF NOT EXISTS channel_admins (
                id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                channel_id UUID NOT NULL REFERENCES channels(id) ON DELETE CASCADE,
                telegram_user_id VARCHAR(255) NOT NULL,
                created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
                UNIQUE (channel_id, telegram_user_id)
            );
            INSERT INTO channel_admins (id, channel_id, telegram_user_id, created_at)
            SELECT gen_random_uuid(), id, admin_telegram_user_id, created_at
            FROM channels
            WHERE admin_telegram_user_id != '' AND admin_telegram_user_id != '0'
            AND NOT EXISTS (
                SELECT 1 FROM channel_admins ca
                WHERE ca.channel_id = channels.id
                AND ca.telegram_user_id = channels.admin_telegram_user_id
            );

            INSERT INTO channels (id, telegram_channel_id, title, admin_telegram_user_id, is_subscription_active)
            SELECT gen_random_uuid(), '__legacy__', 'Legacy Default Channel', '0', true
            WHERE NOT EXISTS (SELECT 1 FROM channels WHERE telegram_channel_id = '__legacy__');

            UPDATE events SET channel_id = (SELECT id FROM channels WHERE telegram_channel_id = '__legacy__')
            WHERE channel_id IS NULL;
          EOSQL
          echo "✅ Схема синхронизирована"

      - name: 🗄️ Права на таблицы и очистка тестовых данных
        run: |
          docker compose ${{ env.COMPOSE_FILES }} exec -T db psql -U postgres -d ticketbot <<-EOSQL
            GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA public TO tg_user;
            GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA public TO vk_user;
            GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA public TO max_user;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE ON TABLES TO tg_user;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE ON TABLES TO vk_user;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE ON TABLES TO max_user;

            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO tg_user;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO vk_user;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO max_user;

            -- Удалить тестовые seed-мероприятия (созданные seed.py)
            DELETE FROM payments WHERE ticket_id IN (
              SELECT t.id FROM tickets t JOIN events e ON t.event_id = e.id
              WHERE e.title LIKE 'Концерт ''Рок-хиты''%' OR e.title LIKE 'Stand-up%' OR e.title LIKE 'Театральная%'
                 OR e.title LIKE 'Фестиваль%' OR e.title LIKE 'Мастер-класс%' OR e.title LIKE 'Спектакль%'
            );
            DELETE FROM tickets WHERE event_id IN (
              SELECT id FROM events
              WHERE title LIKE 'Концерт ''Рок-хиты''%' OR title LIKE 'Stand-up%' OR title LIKE 'Театральная%'
                 OR title LIKE 'Фестиваль%' OR title LIKE 'Мастер-класс%' OR title LIKE 'Спектакль%'
            );
            DELETE FROM events
              WHERE title LIKE 'Концерт ''Рок-хиты''%' OR title LIKE 'Stand-up%' OR title LIKE 'Театральная%'
                 OR title LIKE 'Фестиваль%' OR title LIKE 'Мастер-класс%' OR title LIKE 'Спектакль%';
          EOSQL
          echo "✅ Права выданы, тестовые данные очищены"

      - name: 🚀 Запустить Telegram бота
        run: |
          docker compose ${{ env.COMPOSE_FILES }} up -d telegram
          echo "✅ Telegram бот запущен"

      - name: 📊 Запустить мониторинг (Loki + Promtail + Grafana)
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          docker compose ${{ env.COMPOSE_FILES }} up -d loki promtail grafana
          echo "✅ Мониторинг запущен"

      - name: 🔐 Получить SSL-сертификат (Let's Encrypt)
        run: |
          if [ ! -d "/etc/letsencrypt/live/pochtibot.online" ]; then
            echo "🔐 Получение SSL-сертификата для pochtibot.online..."
            docker run --rm -v /etc/letsencrypt:/etc/letsencrypt -v /var/www/certbot:/var/www/certbot -p 80:80 certbot/certbot:latest certonly --standalone -d pochtibot.online --non-interactive --agree-tos -m admin@pochtibot.online --preferred-challenges http || true
          else
            echo "✅ SSL-сертификат уже есть"
          fi

      - name: 🚀 Запустить Nginx reverse proxy
        run: |
          docker compose ${{ env.COMPOSE_FILES }} up -d nginx
          echo "✅ Nginx запущен"

      - name: 🚀 Запустить VK бота (если есть токен)
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        if: env.VK_TOKEN != ''
        run: |
          docker compose ${{ env.COMPOSE_FILES }} --profile all up -d vk
          echo "✅ VK бот запущен"

      - name: ⏰ Установить cron-задание самодиагностики
        run: |
          CRON_CMD="*/5 * * * * cd ${GITHUB_WORKSPACE} && python3 scripts/cron-diagnose.py >> /var/log/ticketbot-diagnose.log 2>&1"
          (crontab -l 2>/dev/null | grep -Fq "$CRON_CMD") && echo "✅ Cron-задание уже актуально" || (
            (crontab -l 2>/dev/null | grep -v cron-diagnose; echo "$CRON_CMD") | crontab - &&
            echo "✅ Cron-задание установлено (или обновлено)"
          )

      - name: 🩺 Проверка работоспособности
        run: |
          echo "⏳ Ожидание запуска Telegram бота (до 45с)..."
          for i in $(seq 1 15); do
            sleep 3
            STATUS=$(docker compose ${{ env.COMPOSE_FILES }} ps --format '{{.Service}}\t{{.Status}}' 2>/dev/null | grep "^telegram" | head -1)
            if echo "$STATUS" | grep -qiE "up\b"; then
              echo "✅ Telegram бот работает! Статус: $STATUS"
              docker compose ${{ env.COMPOSE_FILES }} logs --tail 5 telegram
              exit 0
            fi
            echo "  попытка $i/15 — статус: $STATUS"
          done
          echo "❌ Telegram бот не запустился за отведённое время."
          echo ""
          echo "--- docker compose ps ---"
          docker compose ${{ env.COMPOSE_FILES }} ps
          echo ""
          echo "--- логи контейнера ---"
          docker compose ${{ env.COMPOSE_FILES }} logs --tail 50 telegram
          exit 1
